spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: task-service-projects
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/projects/**
            - id: task-service-tasks
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/tasks/**
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/**

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
